name: Scraper de Lotería

on:
  # Disparado por el cron job externo (API de GitHub) o manualmente
  workflow_dispatch:

  # Respaldo opcional: descomenta si quieres que GitHub también lo ejecute.
  # (Cron en UTC: 18-23,0-3 = 12:00 a 21:59 hora Costa Rica.
  #  La deduplicación evita publicar doble.)
  # schedule:
  #   - cron: "*/15 18-23,0-3 * * *"

permissions:
  contents: write

# Evita que dos ejecuciones se pisen entre sí
concurrency:
  group: scraper-loteria
  cancel-in-progress: false

jobs:
  ejecutar-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar scraper
        env:
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHAPI_CHANNEL_ID: ${{ secrets.WHAPI_CHANNEL_ID }}
        run: python scrapper.py

      - name: Guardar estado
        run: |
          if [[ -n "$(git status --porcelain ultimo_envio.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ultimo_envio.json
            git commit -m "Actualizar estado de envíos"
            git pull --rebase origin main
            git push
          fi